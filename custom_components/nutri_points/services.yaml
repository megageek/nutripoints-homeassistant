project_weighing_session:
  name: Project weighing session
  description: Calculate advisory nutrition and points locally without contacting the Nutri Points server.
  fields:
    entry_id:
      name: Server
      description: Required when more than one Nutri Points server is loaded.
      required: false
      selector:
        config_entry:
          integration: nutri_points
    session_id:
      name: Session ID
      description: Weighing session identifier from the session-start trigger. Supports templates.
      required: true
      selector:
        text:
    grams:
      name: Weight (g)
      description: Weight from 0 through 100000 grams. Supports templates.
      required: true
      selector:
        text:

